name: specc
version: '0.1.3'
summary: A lightweight system hardware and thermal profiler
description: |
  Specc is a Python-based utility designed for the Ubuntu ecosystem to 
  gather granular hardware specifications and real-time thermal data.

grade: devel
confinement: strict
base: core22

apps:
  specc:
    command: bin/specc
    plugs:
      - hardware-observe
      - system-observe
      - mount-observe

parts:
  specc:
    plugin: python
    source: .
    python-packages:
      - psutil
      - jsonschema
      - rich
    stage-packages:
      - python3-minimal
      - python3-distutils
    override-build: |
      craftctl default
      pip install . --prefix=$CRAFT_PART_INSTALL
